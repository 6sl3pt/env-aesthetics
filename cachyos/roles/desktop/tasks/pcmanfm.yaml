---
- name: Install PCManFM and related packages
  community.general.pacman:
    name:
      - lxmenu-data
      - pcmanfm-qt
      - qt6ct
      - shared-mime-info
    state: present
    update_cache: true

- name: Ensure PCManFM XDG directory exists
  ansible.builtin.file:
    path: '/etc/xdg/pcmanfm-qt'
    state: directory
    mode: '0755'

- name: Deploy PCManFM configuration file
  ansible.builtin.copy:
    src: pcmanfm.conf
    dest: '/home/{{ target_username }}/.config/pcmanfm-qt/default/settings.conf'
    mode: '0644'

- name: Ensure user icon directory exists
  ansible.builtin.file:
    path: '/home/{{ target_username }}/.local/share/icons'
    state: directory
    owner: '{{ target_username }}'
    group: '{{ target_username }}'
    mode: '0755'

- name: Ensure icon temp directory exists
  ansible.builtin.file:
    path: '/home/{{ target_username }}/.cache/noctalia/colloid-icon-themes'
    state: directory
    owner: '{{ target_username }}'
    group: '{{ target_username }}'
    mode: '0755'

- name: Clone icon repository
  ansible.builtin.git:
    repo: 'https://github.com/vinceliuice/Colloid-icon-theme.git'
    dest: '/home/{{ target_username }}/.cache/noctalia/colloid-icon-themes'
    version: main
    depth: 1
  become: true
  become_user: '{{ target_username }}'
  environment:
    HOME: '/home/{{ target_username }}'

- name: Install colloid icon themes
  ansible.builtin.shell: |
    "/home/{{ target_username }}/.cache/noctalia/colloid-icon-themes/install.sh" \
    -d "/home/{{ target_username }}/.local/share/icons" \
    -n "Noctalia-Colloid" \
    -t default \
    -s default
  become: true
  become_user: '{{ target_username }}'
  environment:
    HOME: '/home/{{ target_username }}'
  args:
    executable: /bin/bash

- name: Cleanup icon repository
  ansible.builtin.shell: |
    rm -rf .git .github
  args:
    chdir: '/home/{{ target_username }}/.local/share/icons/Noctalia-Colloid'

- name: Flatten icon theme and replace original directory
  ansible.builtin.shell: |
    cp -rL "Noctalia-Colloid" "Noctalia-Colloid-tmp" 2>/dev/null || true
    rm -rf "Noctalia-Colloid"
    mv "Noctalia-Colloid-tmp" "Noctalia-Colloid"
  args:
    chdir: '/home/{{ target_username }}/.local/share/icons'

- name: Cleanup unused icon directories
  ansible.builtin.shell: |
    rm -rf "Noctalia-Colloid-Dark" \
    "Noctalia-Colloid-light" \
    "Noctalia-Colloid-Dark" \
    "Noctalia-Colloid-Light"
  args:
    chdir: '/home/{{ target_username }}/.local/share/icons'

- name: Reinitialize Git repository and update icon cache
  ansible.builtin.shell: |
    git init -q
    git add .
    git -c user.name='noctaliatemplate' -c user.email='noctalia@temp' commit --no-verify -q -m 'original'
    git tag -f 'original'
    gtk-update-icon-cache -f -t "/home/{{ target_username }}/.local/share/icons/Noctalia-Colloid"
  args:
    chdir: '/home/{{ target_username }}/.local/share/icons/Noctalia-Colloid'
    executable: /bin/bash
