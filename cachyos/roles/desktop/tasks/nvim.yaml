---
- name: Install Neovim and related packages via pacman
  community.general.pacman:
    name:
      - eza
      - fd
      - fzf
      - gcc
      - lua-language-server
      - neovim
      - nodejs
      - npm
      - ripgrep
      - tree-sitter
    state: present
    update_cache: true

- name: Install Neovim and related packages via yay
  ansible.builtin.shell: |
    yay -Syu --noconfirm --needed \
      nixd \
      nixfmt
  become: true
  become_user: aurbuilder
  environment:
    HOME: '/home/aurbuilder'
