---
- name: Install fonts via pacman
  community.general.pacman:
    name:
      - noto-fonts-emoji
      - ttf-cascadia-mono-nerd
    state: present
    update_cache: true

- name: Install fonts via yay
  ansible.builtin.shell: |
    yay -Syu --noconfirm --needed \
      undefined-medium-fonts
  become: true
  become_user: aurbuilder
  environment:
    HOME: '/home/aurbuilder'

- name: Ensure custom fonts directory existed
  ansible.builtin.file:
    path: '/usr/share/fonts/custom'
    state: directory
    mode: '0755'

- name: Download Google Sans Flex
  ansible.builtin.get_url:
    url: 'https://raw.githubusercontent.com/google/fonts/main/ofl/googlesansflex/GoogleSansFlex%5BROND%2Copsz%2Cslnt%2Cwdth%2Cwght%5D.ttf'
    dest: '/usr/share/fonts/custom/GoogleSansFlex.tff'
    mode: '0644'

- name: Download IBM Plex Sans Thai Regular
  ansible.builtin.get_url:
    url: 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansthai/IBMPlexSansThai-Regular.ttf'
    dest: '/usr/share/fonts/custom/IBMPlexSansThai-Regular.tff'
    mode: '0644'

- name: Download IBM Plex Sans Thai Bold
  ansible.builtin.get_url:
    url: 'https://raw.githubusercontent.com/google/fonts/main/ofl/ibmplexsansthai/IBMPlexSansThai-Bold.ttf'
    dest: '/usr/share/fonts/custom/IBMPlexSansThai-Bold.tff'
    mode: '0644'

- name: Refresh system font cache
  ansible.builtin.command:
    cmd: fc-cache -f -v
  changed_when: true
