[lockscreen]
transition = []

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2", "clock@DP-3", "clock@DP-2", "media@DP-3", "media@DP-2" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."clock@DP-3"]
box_height = 352.0
box_width = 832.0
cx = 1280.0
cy = 620.0
output = "DP-3"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget."clock@DP-3".settings]
background = false
clock_style = "digital"
color = "primary"
font_family = "undefined"
format = "{:%H:%M}"
shadow = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
box_height = 70.0
box_width = 400.0
cx = 1280.0
cy = 770.0
output = "DP-3"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
background_color = "surface_variant"
background_opacity = 0.0
background_radius = 0.0
center_password_text = true
input_opacity = 0.7
input_radius = 0.0
layout = "compact"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = false
show_unlock_hint = false

[lockscreen_widgets.widget."media@DP-3"]
box_height = 0.0
box_width = 0.0
cx = 1280.0
cy = 890.0
output = "DP-3"
placement_height = 1440.0
placement_width = 2560.0
rotation = 0.0
type = "media_player"

[lockscreen_widgets.widget."media@DP-3".settings]
album_art_background = true
audio_visualizer = true
hide_when_no_media = true

[lockscreen_widgets.widget."clock@DP-2"]
box_height = 300.0
box_width = 650.0
cx = 540.0
cy = 870.0
output = "DP-2"
placement_height = 1920.0
placement_width = 1080.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget."clock@DP-2".settings]
background = false
clock_style = "digital"
color = "primary"
font_family = "undefined"
format = "{:%H:%M}"
shadow = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
box_height = 70.0
