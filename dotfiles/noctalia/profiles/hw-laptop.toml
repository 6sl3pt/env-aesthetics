[lockscreen]
transition = []
widget_order = ["clock_main"]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "clock@eDP-1" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."clock@eDP-1"]
box_height = 352.0
box_width = 832.0
cx = 960.0
cy = 412.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget."clock@eDP-1".settings]
background = false
clock_style = "digital"
color = "primary"
font_family = "undefined"
format = "{:%H:%M}"
shadow = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 70.0
box_width = 400.0
cx = 960.0
cy = 620.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_variant"
background_opacity = 0.0
background_radius = 0.0
center_password_text = true
input_opacity = 0.7
input_radius = 0.0
layout = "compact"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = false
show_unlock_hint = false
