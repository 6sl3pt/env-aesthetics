[theme]
mode             = "dark"
shell_mode       = "follow"
source           = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates   = true
builtin_ids                = [ "btop", "kitty", "niri", "umbriel", ]
enable_community_templates = true
community_ids              = [ "zen-browser", ]

[wallpaper]
enabled   = true
fill_mode = "crop"
directory = "/home/phudit/personal/env-aesthetics/background/"

[wallpaper.default]
path = "/home/phudit/personal/env-aesthetics/background/portejoie-on-the-seine.jpg"

[shell]
font_family = "Google Sans Flex"

[shell.greeter_sync]
auto_sync = true

[backdrop]
enabled         = true
blur_intensity  = 0.5
tint_intensity  = 0.3

[osd.kind]
media = false

[bar.default]
font_family = "CaskaydiaMono Nerd Font"
margin_ends        = 0
radius             = 0
scale              = 0.8
thickness          = 28
background_opacity = 0.8
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "battery",
    "session"
]
start = [ "control-center", "workspaces", "media" ]

[battery]
warning_threshold = 20

[widget.clock]
format = "{:%A} {:%H:%M}"

[widget.control-center]
color = "primary"

[widget.media]
hide_when_no_media = true

[widget.session]
color = "primary"

[widget.workspaces]
style = "minimal"

[include]
autoload = false
files = [
  "profiles/hw-laptop.toml"
]
