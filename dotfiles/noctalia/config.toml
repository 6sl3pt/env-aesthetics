[theme]
mode             = "dark"
shell_mode       = "follow"
source           = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates   = true
builtin_ids                = [ "btop", "gtk3", "gtk4", "kitty", "niri", "qt", "umbriel", ]
enable_community_templates = true
community_ids              = [ "discord", "spicetify", "steam", "thunderbird", "zen-browser", ]

[wallpaper]
enabled   = true
fill_mode = "crop"
directory = "/home/phudit/personal/env-aesthetics/background/"

[wallpaper.default]
path = "/home/phudit/personal/env-aesthetics/background/portejoie-on-the-seine.jpg"

[shell]
font_family = "Google Sans Flex"
polkit_agent = true

[shell.greeter_sync]
auto_sync = true

[backdrop]
enabled         = true
blur_intensity  = 0.5
tint_intensity  = 0.3

[osd.kinds]
media = false

[bar.default]
font_family = "CaskaydiaMono Nerd Font"
margin_ends        = 0
radius             = 0
scale              = 0.8
thickness          = 28
background_opacity = 0.6
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "battery",
    "session"
]
start = [
  "control-center",
  "workspaces",
  "media",
  "audio_visualizer"
]

[battery]
warning_threshold = 20

[widget.clock]
format = "{:%A} {:%H:%M}"

[widget.control-center]
color = "primary"

[widget.media]
hide_when_no_media = true

[widget.notifications]
hide_when_no_unread = true

[widget.session]
color = "primary"

[widget.tray]
drawer = true

[widget.workspaces]
style = "minimal"

[theme.templates.user.noctalia-colloid]
input_path  = "~/.config/noctalia/templates/Noctalia-Colloid.sh"
output_path = "~/.cache/noctalia/Noctalia-Colloid-apply.sh"
post_hook   = "bash ~/.cache/noctalia/Noctalia-Colloid-apply.sh"

[include]
autoload = false
files = ["profiles/current.toml"]
