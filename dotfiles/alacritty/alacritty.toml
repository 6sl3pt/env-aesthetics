[general]
import = [
  # "~/.config/alacritty/themes/bamboo.toml",
  "~/.config/alacritty/themes/gruvbox-material.toml",
]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "CaskaydiaMono Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaMono Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaMono Nerd Font", style = "Italic" }
size = 9

[font.glyph_offset]
y = 1

[window]
padding.x = 14
padding.y = 14
decorations = "None"
opacity = 0.95
